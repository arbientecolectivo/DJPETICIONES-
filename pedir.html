<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><style>:root{--accent:#a78bfa;color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;color:#f6f3ff;background:radial-gradient(circle at 15% 0%,#302450,#111120 55%,#0c0b16);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #5a4b78;background:#302545;color:#fff;padding:11px 15px;border-radius:11px}button.primary{background:var(--accent);border-color:var(--accent);color:#130f1e;font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}button.danger{border-color:#8b465e;color:#ffb3c1}input,textarea,select{background:#121120;color:white;border:1px solid #46405d;border-radius:10px;padding:12px;width:100%;min-width:0}input[type=color]{padding:3px;height:44px}input[type=checkbox]{width:auto}label{display:block;color:#d6d0e8;font-size:13px;margin-bottom:6px}h1{font-size:clamp(25px,4vw,35px);margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}p{color:#b9b1cf;line-height:1.5}.shell{max-width:1250px;margin:auto;padding:25px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.identity{display:flex;align-items:center;gap:14px}.identity img{width:55px;height:55px;object-fit:contain}.muted{font-size:13px;color:#a9a0bd}.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}.nav{display:flex;flex-direction:column;gap:8px;align-self:start;position:sticky;top:16px}.nav button{text-align:left;background:#191628;border-color:#373149}.nav button.active{background:#382b54;border-color:var(--accent)}.card{border:1px solid #37314c;background:#1a172b;border-radius:18px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#242037;border-radius:13px;padding:17px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:#b9b1cf}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{min-width:0}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.request{display:flex;justify-content:space-between;gap:14px;border-top:1px solid #37314c;padding:15px 0;align-items:center}.request strong{display:block}.request small{color:#aaa1bd}.request .actions{margin:0}.hide{display:none!important}.preview{width:110px;max-height:95px;object-fit:contain;display:block;margin:8px 0}.banner{width:100%;max-height:180px;object-fit:cover;border-radius:12px}.notice{background:#242036;border:1px solid #443958;border-radius:12px;padding:12px;color:#d4cbe8;font-size:13px;margin:14px 0}.link{overflow-wrap:anywhere;color:#d9c3ff}#qr{background:#fff;padding:10px;border-radius:12px;max-width:180px}a{color:#c8adff}@media(max-width:760px){.grid{display:block}.nav{position:static;flex-direction:row;overflow-x:auto;margin-bottom:15px}.nav button{flex:0 0 auto}.formgrid{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:12px}.request{display:block}.request .actions{margin-top:10px}.card{padding:17px}.top{align-items:flex-start}}</style></head><body><title>Pide tu canción</title><div class="shell" style="max-width:560px"><header class="top"><div class="identity"><img alt="Logo" id="logo" src="logo-blanco.png"/><div><strong id="brand"></strong><div class="muted" id="subtitle"></div></div></div></header><main class="card"><img alt="Portada del evento" class="banner hide" id="banner"/><p class="muted" id="event"></p><h1 id="title"></h1><p id="description"></p><form class="formgrid" id="form" style="margin-top:20px"><div class="field wide"><label for="song" id="songLabel"></label><input id="song" maxlength="120" placeholder="Nombre de la canción" required=""/></div><div class="field wide"><label for="artist" id="artistLabel"></label><input id="artist" maxlength="120" placeholder="Nombre del artista" required=""/></div><div class="field wide"><label for="name" id="nameLabel"></label><input id="name" maxlength="80" placeholder="¿Cómo te llamas?"/></div><button class="primary wide" id="submit" type="submit"></button></form><div class="notice hide" id="message" role="status"></div></main></div><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,collection,onSnapshot,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig = {apiKey:"AIzaSyA67mUsTfxFGuTlD_mr5_tWTix-dHwpOfg",authDomain:"peticiones-62a7f.firebaseapp.com",projectId:"peticiones-62a7f",storageBucket:"peticiones-62a7f.firebasestorage.app",messagingSenderId:"937630450686",appId:"1:937630450686:web:e65f38f3a8ab5141c836af"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const defaults={brand:'PETICIONES EN VIVO',subtitle:'Tu música, tu momento',event:'Sesión en vivo',title:'¿Qué canción quieres escuchar?',description:'Pide tu canción favorita al DJ.',songLabel:'Canción',artistLabel:'Artista',nameLabel:'Tu nombre (opcional)',button:'Enviar petición',requestsHeading:'Peticiones recibidas',shareHeading:'Comparte el QR',accent:'#a78bfa',open:true,required:false,logo:'logo-blanco.png',panelLogo:'logo-blanco.png',banner:''};
const $=id=>document.getElementById(id);
let cfg={...defaults};
const cfgRef=doc(db,'configuracion','principal'), eventRef=doc(db,'eventos','principal');
function errorText(e){return ({'permission-denied':'Permiso denegado: revisa tu UID y las reglas de Firestore.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/unauthorized-domain':'Agrega el dominio en Authentication → Configuración → Dominios autorizados.','unavailable':'No hay conexión con Firebase.'})[e.code]||e.message||String(e)}

let eventOpen=false;
function update(){document.documentElement.style.setProperty('--accent',cfg.accent);for(let k of ['brand','subtitle','event','title','description','songLabel','artistLabel','nameLabel'])$(k).textContent=cfg[k];$('logo').src=cfg.logo||defaults.logo;$('banner').src=cfg.banner||'';$('banner').classList.toggle('hide',!cfg.banner);$('submit').textContent=eventOpen?cfg.button:'Peticiones cerradas';$('submit').disabled=!eventOpen;$('name').required=cfg.required}
function msg(t){$('message').textContent=t;$('message').classList.remove('hide')}
$('submit').disabled=true;
onSnapshot(cfgRef,s=>{cfg={...defaults,...(s.exists()?s.data():{})};update()},e=>msg('No se pudo cargar la configuración: '+errorText(e)));
onSnapshot(eventRef,s=>{eventOpen=s.exists()&&s.data().abierto===true;update()},e=>msg('No se pudo consultar el evento: '+errorText(e)));
$('form').onsubmit=async e=>{e.preventDefault();if(!eventOpen)return msg('Las peticiones están cerradas.');const song=$('song').value.trim(),artist=$('artist').value.trim(),name=$('name').value.trim();if(!song||!artist)return;const b=$('submit');b.disabled=true;b.textContent='Enviando…';try{await addDoc(collection(db,'peticiones'),{eventoId:'principal',cancion:song,artista:artist,nombre:name,estado:'pendiente',creado:serverTimestamp()});$('form').reset();msg('¡Tu canción fue enviada al DJ!')}catch(e){msg('No se pudo enviar: '+errorText(e))}finally{update()}};
update();
</script></body></html>
